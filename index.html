<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Singalong 🎶</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffaf2;
      color: #3b3030;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
    }

    .rings {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    h1 {
      color: #7b3040;
      font-size: clamp(2.5rem, 10vw, 4rem);
      font-weight: normal;
      margin: 0;
    }

    p {
      color: #806f6f;
      font-size: 1.2rem;
      font-style: italic;
      margin: 15px 0 40px;
    }

    .song-button {
      display: block;
      width: 100%;
      padding: 22px 15px;
      margin: 15px 0;
      border-radius: 15px;
      background: #7b3040;
      color: white;
      text-decoration: none;
      font-size: 1.3rem;
      box-shadow: 0 5px 15px rgba(80, 40, 40, 0.15);
    }

    .song-button:active {
      transform: scale(0.98);
    }

    .chorus {
      font-style: italic;
      color: #7b3040;
      margin: 25px 0;
    }
    .lyrics {
      background: #fffdf9;
      border: 1px solid #eadfce;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(80, 50, 40, 0.08);
      font-size: 1.2rem;
      line-height: 1.8;
      white-space: pre-line;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="rings">💍 💍</div>

    <h1>Wedding Singalong</h1>

    <p>Grab a drink, find your voice & sing along! 🎶</p>

    <a class="song-button" href="american-pie.html">
      🎸 American Pie
    </a>

    <a class="song-button" href="the-gambler.html">
      🎲 The Gambler
    </a>

    <a class="song-button" href="black-velvet-band.html">
      🍀 Black Velvet Band
    </a>

    <a class="song-button" href="ill-tell-me-ma.html">
      👵🏻 I'll Tell Me Ma
    </a>
    
    <a class="song-button" href="lying-eyes.html">
      👀 Lying Eyes
    </a>
    
    <a class="song-button" href="country-roads.html">
      🛣️ Country Roads
    </a>


  </div>

</body>
</html>
